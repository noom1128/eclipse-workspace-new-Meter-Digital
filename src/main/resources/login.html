<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - Digital Meter Monitoring</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #090c10;
            --bg-card: rgba(22, 27, 38, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --purple-main: #a855f7;
            --purple-glow: rgba(168, 85, 247, 0.4);
            --magenta-main: #ec4899;
            --cyan-main: #06b6d4;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Kanit', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 20% 20%, rgba(168, 85, 247, 0.18) 0px, transparent 50%),
                radial-gradient(at 80% 80%, rgba(6, 182, 212, 0.12) 0px, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            width: 100%;
            max-width: 440px;
            padding: 40px 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--purple-main), var(--cyan-main));
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-logo {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--purple-main), var(--magenta-main));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 24px;
            color: #fff;
            margin: 0 auto 16px;
            box-shadow: 0 0 25px var(--purple-glow);
        }

        .brand-header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .brand-header p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Role Selector Tabs */
        .role-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn.active {
            background: var(--purple-main);
            color: #fff;
            box-shadow: 0 4px 15px var(--purple-glow);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 14px;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .form-input:focus {
            border-color: var(--purple-main);
            box-shadow: 0 0 12px var(--purple-glow);
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--purple-main), var(--magenta-main));
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 6px 20px var(--purple-glow);
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px var(--purple-glow);
        }

        .alert-box {
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 18px;
            display: none;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
        }

        .demo-hint {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .demo-hint code {
            background: rgba(255,255,255,0.1);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--cyan-main);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-header">
            <div class="brand-logo">ND</div>
            <h1>Digital Meter Service</h1>
            <p>ระบบบริหารจัดการค่าไฟและมิเตอร์ดิจิทัล</p>
        </div>

        <!-- Role Tabs -->
        <div class="role-tabs">
            <button class="tab-btn active" id="tab-admin" onclick="switchRole('admin')">
                <i class="fas fa-user-shield"></i> เจ้าของหอพัก / Admin
            </button>
            <button class="tab-btn" id="tab-tenant" onclick="switchRole('tenant')">
                <i class="fas fa-home"></i> ผู้เช่าห้องพัก
            </button>
        </div>

        <!-- Alert Notification Box -->
        <div id="alert-box" class="alert-box alert-error"></div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label" id="username-label">Username / ชื่อผู้ใช้</label>
                <div class="input-wrapper">
                    <i class="fas fa-user" id="username-icon"></i>
                    <input type="text" id="username" class="form-input" placeholder="กรอกชื่อผู้ใช้งาน (เช่น admin)" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" id="password-label">Password / รหัสผ่าน</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" class="form-input" placeholder="กรอกรหัสผ่าน" required>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submit-btn">
                <i class="fas fa-sign-in-alt"></i> เข้าสู่ระบบ (Login)
            </button>
        </form>

        <div class="demo-hint">
            <strong>💡 บัญชีทดสอบระบบ:</strong><br>
            • Admin: <code>admin</code> / Password: <code>1234</code><br>
            • ผู้เช่า: <code>room101</code> / Password: <code>1234</code>
        </div>
    </div>

    <script>
        let currentRole = 'admin';

        function switchRole(role) {
            currentRole = role;
            const tabAdmin = document.getElementById('tab-admin');
            const tabTenant = document.getElementById('tab-tenant');
            const userInput = document.getElementById('username');
            const usernameLabel = document.getElementById('username-label');
            const usernameIcon = document.getElementById('username-icon');

            if (role === 'admin') {
                tabAdmin.classList.add('active');
                tabTenant.classList.remove('active');
                usernameLabel.innerText = 'Username / ชื่อผู้ใช้ (Admin)';
                userInput.placeholder = 'กรอกชื่อผู้ใช้ (เช่น admin)';
                usernameIcon.className = 'fas fa-user-shield';
                userInput.value = 'admin';
            } else {
                tabTenant.classList.add('active');
                tabAdmin.classList.remove('active');
                usernameLabel.innerText = 'เลขห้องพัก (Room Number)';
                userInput.placeholder = 'กรอกเลขห้องพัก (เช่น room101)';
                usernameIcon.className = 'fas fa-door-open';
                userInput.value = 'room101';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const alertBox = document.getElementById('alert-box');
            const submitBtn = document.getElementById('submit-btn');

            alertBox.style.display = 'none';
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังเข้าสู่ระบบ...';
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    // บันทึก JWT Token และ ข้อมูลผู้ใช้งานลง localStorage
                    localStorage.setItem('jwtToken', data.token);
                    localStorage.setItem('username', data.username || username);
                    localStorage.setItem('userRole', data.role || (currentRole === 'admin' ? 'ROLE_ADMIN' : 'ROLE_TENANT'));

                    alertBox.className = 'alert-box alert-success';
                    alertBox.innerText = '✓ เข้าสู่ระบบสำเร็จ! กำลังนำคุณไปยังหน้าหลัก...';
                    alertBox.style.display = 'block';

                    setTimeout(() => {
                        window.location.href = '/';
                    }, 800);
                } else {
                    alertBox.className = 'alert-box alert-error';
                    alertBox.innerText = '✕ ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง';
                    alertBox.style.display = 'block';
                }
            } catch (err) {
                alertBox.className = 'alert-box alert-error';
                alertBox.innerText = '✕ ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้';
                alertBox.style.display = 'block';
            } finally {
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> เข้าสู่ระบบ (Login)';
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
