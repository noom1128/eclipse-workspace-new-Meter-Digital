spring.application.name=meter-digital
spring.thymeleaf.cache=false

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.datasource.url=jdbc:sqlite:./dorm.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Multipart File Upload Limits for High-Res Smartphone Photos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# Google Gemini Cloud AI Key for Meter OCR (Supports Environment Variable GEMINI_API_KEY)
meter.ocr.cloud.api-key=${GEMINI_API_KEY:AQ.Ab8RN6IyqCiuDWEY9TpY2RD9P5ogXOLLAdEtmD8ZPHzKQp7zOA}

# HTTPS SSL Configuration for Mobile Live Camera Access
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=password
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=springboot
